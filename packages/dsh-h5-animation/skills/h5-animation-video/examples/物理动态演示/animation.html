<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>物理过程动态演示</title>
<link rel="stylesheet" href="vendor/katex/katex-inline.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#ffffff;overflow:hidden}
  #stage{position:relative;width:1280px;height:720px}
  canvas{display:block;width:1280px;height:720px}
  #math{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
  #math .f{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;will-change:opacity,transform}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="math"></div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script>
(function () {
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
  var TAU = Math.PI * 2;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 1280, H = 720;

  var VM = window.__VM || { fps: 30, segments: [
    { id: 'title', start: 0, dur: 5 },
    { id: 'projectile', start: 5, dur: 7 },
    { id: 'spring', start: 12, dur: 7 },
    { id: 'circular', start: 19, dur: 7 },
    { id: 'outro', start: 26, dur: 6 }
  ]};
  var SEG = VM.segments;
  var TOTAL = SEG[SEG.length - 1].start + SEG[SEG.length - 1].dur;
  var FADE = 0.5;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function ease(p) { p = clamp(p, 0, 1); return 1 - Math.pow(1 - p, 3); }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function panel(x, y, w, h, a) {
    rr(x, y, w, h, 18);
    ctx.save();
    ctx.shadowColor = 'rgba(15,23,42,' + (0.10 * a) + ')';
    ctx.shadowBlur = 22; ctx.shadowOffsetY = 7;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.95 * a) + ')';
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(15,23,42,' + (0.12 * a) + ')';
    ctx.lineWidth = 1.5; ctx.stroke();
  }
  function text(s, x, y, font, color, align, baseline) {
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align || 'left'; ctx.textBaseline = baseline || 'alphabetic';
    ctx.fillText(s, x, y);
  }
  function arrow(x1, y1, x2, y2, color, width) {
    var ang = Math.atan2(y2 - y1, x2 - x1), hl = 11 + width * 1.8;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - hl * Math.cos(ang - 0.42), y2 - hl * Math.sin(ang - 0.42));
    ctx.lineTo(x2 - hl * Math.cos(ang + 0.42), y2 - hl * Math.sin(ang + 0.42));
    ctx.closePath(); ctx.fill();
  }
  function dashLine(x1, y1, x2, y2, color, w, d) {
    ctx.save(); ctx.setLineDash(d || [7, 7]);
    ctx.strokeStyle = color; ctx.lineWidth = w || 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
  }

  /* ===================== LaTeX 公式层 =====================
   * 所有物理量和公式都走这里，TeX 字体（KaTeX = Computer Modern 风格），
   * 根号、分数、上下标都是真正的排版，不是用 ^ 和 sqrt 凑的。 */
  var MATH = [];
  function math(spec) { MATH.push(spec); return spec; }
  function appear(lt, at, d) { return ease((lt - (at === undefined ? 0.15 : at)) / (d || 0.45)); }
  var IN = function (lt) { return ease(clamp(lt / 0.6, 0, 1)); };

  function buildMath() {
    var host = document.getElementById('math');
    var ok = (typeof katex !== 'undefined');
    MATH.forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'f';
      el.style.fontSize = (f.size || 30) + 'px';
      if (f.color) el.style.color = f.color;
      if (ok) {
        try { katex.render(f.tex, el, { throwOnError: false, displayMode: false }); }
        catch (e) { el.textContent = f.tex; }
      } else {
        el.style.fontFamily = 'Georgia,serif';
        el.textContent = f.tex;
      }
      host.appendChild(el);
      f.el = el;
    });
  }
  function syncMath(idx, lt, prevIdx) {
    for (var i = 0; i < MATH.length; i++) {
      var f = MATH[i], pos = null, a = 0;
      if (f.seg === SEG[idx].id) {
        pos = f.place(lt, SEG[idx].dur);
        a = (pos.a === undefined ? 1 : pos.a) * (idx > 0 && lt < FADE ? lt / FADE : 1);
      } else if (prevIdx >= 0 && f.seg === SEG[prevIdx].id) {
        pos = f.place(SEG[prevIdx].dur, SEG[prevIdx].dur);
        a = (pos.a === undefined ? 1 : pos.a);
      }
      f.el.style.opacity = a;
      if (pos) {
        var anchor = pos.anchor || f.anchor || 'left';
        f.el.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px) translate(' +
          (anchor === 'center' ? '-50%' : '0') + ',-50%)';
      }
    }
  }

  /* ---------- 背景：纯白 + 细网格 ---------- */
  function bg(t) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(100,116,139,0.10)';
    ctx.lineWidth = 1;
    for (var x = 0; x <= W; x += 64) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
    for (var y = 0; y <= H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
  }

  /* ================= 场景几何（画面与公式层共用同一套坐标） ================= */
  var PJ = { ox: 200, oy: 196, XS: 480, YS: 286 };
  function projQ(lt, dur) { return clamp(lt / (dur * 0.78), 0, 1); }
  function projBall(q) { return { x: PJ.ox + PJ.XS * q, y: PJ.oy + PJ.YS * q * q }; }
  function projVy(q) { return 26 + 150 * q; }

  var SP = { eq: 430, amp: 120, cy: 250, f: 0.6 };
  function springX(lt) { return SP.eq + SP.amp * Math.sin(TAU * SP.f * lt); }

  var CI = { cx: 830, cy: 350, r: 150, f: 0.4 };
  function circTh(lt) { return -Math.PI / 2 + TAU * CI.f * lt; }

  /* ================= 平抛运动的公式 ================= */
  math({ id: 'pj-o', seg: 'projectile', tex: 'O', size: 22,
    place: function (lt) { return { x: 170, y: 184, a: IN(lt) }; } });
  math({ id: 'pj-x', seg: 'projectile', tex: 'x', size: 22,
    place: function (lt) { return { x: 752, y: 180, a: IN(lt) }; } });
  math({ id: 'pj-y', seg: 'projectile', tex: 'y', size: 22,
    place: function (lt) { return { x: 168, y: 576, a: IN(lt) }; } });
  math({ id: 'pj-eqx', seg: 'projectile', tex: 'x = v_0 t', size: 32,
    place: function (lt) { return { x: 830, y: 316, a: appear(lt, 0.5) }; } });
  math({ id: 'pj-eqy', seg: 'projectile', tex: 'y = \\tfrac{1}{2} g t^2', size: 32,
    place: function (lt) { return { x: 830, y: 434, a: appear(lt, 0.9) }; } });
  math({ id: 'pj-vx', seg: 'projectile', tex: 'v_x', size: 24, color: '#2563eb',
    place: function (lt, dur) { var b = projBall(projQ(lt, dur)); return { x: b.x + 122, y: b.y, a: IN(lt) }; } });
  math({ id: 'pj-vy', seg: 'projectile', tex: 'v_y', size: 24, color: '#b45309',
    place: function (lt, dur) { var q = projQ(lt, dur), b = projBall(q); return { x: b.x + 16, y: b.y + projVy(q), a: IN(lt) }; } });
  math({ id: 'pj-v', seg: 'projectile', tex: 'v', size: 24, color: '#15803d',
    place: function (lt, dur) { var q = projQ(lt, dur), b = projBall(q); return { x: b.x + 116, y: b.y + projVy(q), a: IN(lt) }; } });

  function sceneProjectile(lt, dur) {
    var ox = PJ.ox, oy = PJ.oy, XS = PJ.XS, YS = PJ.YS;
    var q = projQ(lt, dur);

    dashLine(120, oy, 800, oy, 'rgba(100,116,139,0.45)', 1.4, [8, 8]);
    dashLine(ox, oy - 40, ox, 580, 'rgba(100,116,139,0.45)', 1.4, [8, 8]);
    arrow(760, oy, 800, oy, 'rgba(100,116,139,0.7)', 1.4);
    arrow(ox, 540, ox, 580, 'rgba(100,116,139,0.7)', 1.4);

    for (var k = 1; k <= 8; k++) {
      var tk = k / 8;
      if (tk > q + 0.001) break;
      var gx = ox + XS * tk, gy = oy + YS * tk * tk;
      ctx.fillStyle = 'rgba(37,99,235,0.34)';
      ctx.beginPath(); ctx.arc(gx, gy, 6, 0, TAU); ctx.fill();
      dashLine(gx, gy, gx, oy, 'rgba(37,99,235,0.22)', 1, [4, 6]);
      dashLine(ox, gy, gx, gy, 'rgba(249,115,22,0.22)', 1, [4, 6]);
    }

    ctx.save();
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(15,23,42,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i <= 60; i++) {
      var u = (i / 60) * q;
      var px = ox + XS * u, py = oy + YS * u * u;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    var bx = ox + XS * q, by = oy + YS * q * q;
    ctx.fillStyle = 'rgba(37,99,235,0.12)';
    ctx.beginPath(); ctx.arc(bx, by, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.arc(bx, by, 11, 0, TAU); ctx.fill();

    var vyLen = projVy(q);
    arrow(bx, by, bx + 104, by, '#2563eb', 2.5);
    arrow(bx, by, bx, by + vyLen, '#f59e0b', 2.5);
    arrow(bx, by, bx + 104, by + vyLen, 'rgba(22,163,74,0.90)', 2);

    var PA = ease(clamp(lt / 0.6, 0, 1));
    panel(806, 168, 366, 360, PA);
    text('平抛运动', 830, 216, '700 30px ' + FONT, 'rgba(15,23,42,' + PA + ')');
    ctx.fillStyle = 'rgba(37,99,235,' + (0.8 * PA) + ')';
    ctx.fillRect(830, 230, 120, 3);

    text('水平方向', 830, 286, '600 19px ' + FONT, 'rgba(37,99,235,' + PA + ')');
    text('匀速直线运动', 830, 366, '400 18px ' + FONT, 'rgba(100,116,139,' + PA + ')');
    text('竖直方向', 830, 404, '600 19px ' + FONT, 'rgba(245,158,11,' + PA + ')');
    text('自由落体运动', 830, 484, '400 18px ' + FONT, 'rgba(100,116,139,' + PA + ')');
    text('合运动轨迹：抛物线', 830, 522, '400 19px ' + FONT, 'rgba(22,163,74,' + PA + ')');
  }

  /* ================= 弹簧振子的公式 ================= */
  math({ id: 'sp-o', seg: 'spring', tex: 'O', size: 22, anchor: 'center',
    place: function (lt) { return { x: SP.eq, y: 112, a: IN(lt) }; } });
  math({ id: 'sp-m', seg: 'spring', tex: 'm', size: 30, color: '#ffffff', anchor: 'center',
    place: function (lt) { return { x: springX(lt), y: SP.cy + 1, a: 1 }; } });
  math({ id: 'sp-x', seg: 'spring', tex: 'x', size: 22, anchor: 'center', color: '#ea580c',
    place: function (lt) { return { x: (SP.eq + springX(lt)) / 2, y: 320, a: appear(lt, 0.4) }; } });
  math({ id: 'sp-f', seg: 'spring', tex: 'F = -k x', size: 34,
    place: function (lt) { return { x: 784, y: 250, a: IN(lt) }; } });
  math({ id: 'sp-t', seg: 'spring', tex: 'T = 2\\pi\\sqrt{\\dfrac{m}{k}}', size: 28,
    place: function (lt) { return { x: 784, y: 348, a: appear(lt, 0.4) }; } });
  math({ id: 'sp-gx', seg: 'spring', tex: 'x', size: 22,
    place: function (lt) { return { x: 198, y: 432, a: IN(lt) }; } });
  math({ id: 'sp-gt', seg: 'spring', tex: 't', size: 22,
    place: function (lt) { return { x: 1126, y: 628, a: IN(lt) }; } });

  function sceneSpring(lt, dur) {
    var f = SP.f, eq = SP.eq, cy = SP.cy;
    var xb = springX(lt);
    var te = ease(clamp(lt / 0.6, 0, 1));

    ctx.save();
    ctx.strokeStyle = 'rgba(100,116,139,0.38)';
    ctx.lineWidth = 2;
    for (var hy = 152; hy < 350; hy += 14) {
      ctx.beginPath(); ctx.moveTo(136, hy + 14); ctx.lineTo(116, hy); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(100,116,139,0.55)';
    ctx.fillRect(136, 148, 10, 204);
    ctx.restore();

    dashLine(eq, 130, eq, 372, 'rgba(100,116,139,0.45)', 1.4, [8, 8]);

    var x1 = 146, x2 = xb - 40, coils = 14;
    ctx.strokeStyle = 'rgba(37,99,235,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x1, cy);
    var dx = (x2 - x1) / coils;
    for (var i = 0; i < coils; i++) {
      var mx = x1 + dx * (i + 0.5);
      var yy = cy + (i % 2 === 0 ? -26 : 26);
      ctx.lineTo(mx, yy);
    }
    ctx.lineTo(x2, cy);
    ctx.stroke();

    ctx.save();
    ctx.shadowColor = 'rgba(37,99,235,0.40)';
    ctx.shadowBlur = 26;
    var bg2 = ctx.createLinearGradient(xb - 42, cy - 42, xb + 42, cy + 42);
    bg2.addColorStop(0, '#2563eb'); bg2.addColorStop(1, '#1d4ed8');
    ctx.fillStyle = bg2;
    rr(xb - 42, cy - 42, 84, 84, 14);
    ctx.fill();
    ctx.restore();

    arrow(eq, 330, xb, 330, 'rgba(249,115,22,0.95)', 2.5);

    panel(760, 128, 412, 272, te);
    text('简谐振动', 784, 188, '700 30px ' + FONT, 'rgba(15,23,42,' + te + ')');
    ctx.fillStyle = 'rgba(37,99,235,' + (0.8 * te) + ')';
    ctx.fillRect(784, 202, 120, 3);
    text('F 与位移成正比，方向始终指向平衡位置', 784, 296, '400 17px ' + FONT, 'rgba(100,116,139,' + te + ')');

    var gx0 = 240, gy0 = 620, gw = 880, gh = 180;
    dashLine(gx0 - 40, gy0, gx0 + gw, gy0, 'rgba(100,116,139,0.5)', 1.4);
    dashLine(gx0, gy0 + 30, gx0, gy0 - gh, 'rgba(100,116,139,0.5)', 1.4);
    dashLine(gx0, gy0 - 62, gx0 + gw, gy0 - 62, 'rgba(100,116,139,0.22)', 1, [5, 7]);

    ctx.save();
    ctx.strokeStyle = 'rgba(249,115,22,0.95)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var N = 220;
    for (var j = 0; j <= N; j++) {
      var tt = (j / N) * lt;
      var xx = gx0 + gw * (tt / dur);
      var yy2 = gy0 - 62 - 74 * Math.sin(TAU * f * tt);
      if (j === 0) ctx.moveTo(xx, yy2); else ctx.lineTo(xx, yy2);
    }
    ctx.stroke();
    ctx.restore();

    var cxp = gx0 + gw * (lt / dur);
    var cyp = gy0 - 62 - 74 * Math.sin(TAU * f * lt);
    ctx.fillStyle = 'rgba(245,158,11,0.25)';
    ctx.beginPath(); ctx.arc(cxp, cyp, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(cxp, cyp, 6, 0, TAU); ctx.fill();
    dashLine(cxp, cyp, cxp, gy0, 'rgba(245,158,11,0.35)', 1, [4, 6]);
  }

  /* ================= 匀速圆周运动的公式 ================= */
  math({ id: 'ci-o', seg: 'circular', tex: 'O', size: 20,
    place: function (lt) { return { x: CI.cx - 30, y: CI.cy - 14, a: IN(lt) }; } });
  math({ id: 'ci-r', seg: 'circular', tex: 'r', size: 24, color: '#334155',
    place: function (lt) { var th = circTh(lt); return { x: CI.cx + CI.r * 0.78 * Math.cos(th) - Math.sin(th) * 18, y: CI.cy + CI.r * 0.78 * Math.sin(th) + Math.cos(th) * 18, a: IN(lt) }; } });
  math({ id: 'ci-v', seg: 'circular', tex: 'v', size: 24, color: '#2563eb',
    place: function (lt) {
      var th = circTh(lt), px = CI.cx + CI.r * Math.cos(th), py = CI.cy + CI.r * Math.sin(th);
      return { x: px - Math.sin(th) * 154 - 8, y: py + Math.cos(th) * 154 + 8, a: IN(lt) };
    } });
  math({ id: 'ci-f', seg: 'circular', tex: 'F', size: 24, color: '#dc2626',
    place: function (lt) {
      var th = circTh(lt), px = CI.cx + CI.r * Math.cos(th), py = CI.cy + CI.r * Math.sin(th);
      return { x: px - Math.cos(th) * 58 - Math.sin(th) * 15, y: py - Math.sin(th) * 58 + Math.cos(th) * 15, a: IN(lt) };
    } });
  math({ id: 'ci-eqv', seg: 'circular', tex: 'v = \\dfrac{2\\pi r}{T}', size: 30,
    place: function (lt) { return { x: 134, y: 286, a: IN(lt) }; } });
  math({ id: 'ci-eqf', seg: 'circular', tex: 'F = \\dfrac{m v^2}{r}', size: 30,
    place: function (lt) { return { x: 134, y: 404, a: appear(lt, 0.4) }; } });

  function sceneCircular(lt, dur) {
    var cx = CI.cx, cy = CI.cy, r = CI.r, th = circTh(lt);
    var te = ease(clamp(lt / 0.6, 0, 1));

    ctx.save();
    ctx.setLineDash([7, 8]);
    ctx.strokeStyle = 'rgba(100,116,139,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.restore();

    for (var i = 0; i < 12; i++) {
      var ga = -Math.PI / 2 + (i / 12) * TAU;
      ctx.fillStyle = 'rgba(100,116,139,0.30)';
      ctx.beginPath(); ctx.arc(cx + r * Math.cos(ga), cy + r * Math.sin(ga), 4, 0, TAU); ctx.fill();
    }

    ctx.save();
    ctx.strokeStyle = 'rgba(37,99,235,0.5)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, r, th - 1.7, th); ctx.stroke();
    ctx.restore();

    var px = cx + r * Math.cos(th), py = cy + r * Math.sin(th);
    dashLine(cx, cy, px, py, 'rgba(15,23,42,0.75)', 1.8, [7, 6]);

    var tx = -Math.sin(th), ty = Math.cos(th);
    arrow(px, py, px + tx * 130, py + ty * 130, '#2563eb', 3);
    arrow(px, py, px - Math.cos(th) * 96, py - Math.sin(th) * 96, '#dc2626', 3);

    ctx.fillStyle = 'rgba(15,23,42,0.9)';
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.fill();

    ctx.save();
    ctx.shadowColor = 'rgba(37,99,235,0.45)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.arc(px, py, 12, 0, TAU); ctx.fill();
    ctx.restore();

    panel(110, 160, 430, 330, te);
    text('匀速圆周运动', 134, 210, '700 30px ' + FONT, 'rgba(15,23,42,' + te + ')');
    ctx.fillStyle = 'rgba(37,99,235,' + (0.8 * te) + ')';
    ctx.fillRect(134, 224, 120, 3);
    text('线速度大小不变，方向沿切线', 134, 352, '400 17px ' + FONT, 'rgba(100,116,139,' + te + ')');
    text('向心力始终指向圆心', 134, 466, '400 17px ' + FONT, 'rgba(220,38,38,' + te + ')');
  }

  /* ================= 结尾 ================= */
  function sceneOutro(lt, dur) {
    text('从网页到视频', W / 2, 150, '700 46px ' + FONT, 'rgba(15,23,42,' + ease(clamp(lt / 0.7, 0, 1)) + ')', 'center');
    var cards = [
      ['1', 'HTML 动画', '一个网页就是一块画布'],
      ['2', '逐帧录制', '30fps 精确定格，画面不丢帧'],
      ['3', '旁白配音', '中文语音自动生成并对齐']
    ];
    var cw = 330, ch = 210, gap = 55;
    var totalW = cards.length * cw + (cards.length - 1) * gap;
    var x0 = W / 2 - totalW / 2, y0 = 250;
    for (var i = 0; i < cards.length; i++) {
      var ap = ease((lt - 0.45 - i * 0.65) / 0.6);
      if (ap <= 0.001) continue;
      var x = x0 + i * (cw + gap), y = y0 + (1 - ap) * 26;
      rr(x, y, cw, ch, 20);
      ctx.save();
      ctx.shadowColor = 'rgba(15,23,42,' + (0.09 * ap) + ')';
      ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.99 * ap) + ')';
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(37,99,235,' + (0.42 * ap) + ')';
      ctx.lineWidth = 1.6; ctx.stroke();

      ctx.fillStyle = 'rgba(37,99,235,' + (0.95 * ap) + ')';
      ctx.beginPath(); ctx.arc(x + 46, y + 52, 21, 0, TAU); ctx.fill();
      text(cards[i][0], x + 46, y + 53, '700 24px ' + FONT, '#ffffff', 'center', 'middle');
      text(cards[i][1], x + 82, y + 62, '700 27px ' + FONT, 'rgba(15,23,42,' + ap + ')');
      text(cards[i][2], x + 30, y + 130, '400 17px ' + FONT, 'rgba(100,116,139,' + ap + ')');
      ctx.fillStyle = 'rgba(37,99,235,' + (0.7 * ap) + ')';
      ctx.fillRect(x + 30, y + 152, 70, 3);

      if (i < cards.length - 1) {
        var aa = ease((lt - 0.9 - i * 0.65) / 0.5);
        if (aa > 0.001) text('→', x + cw + gap / 2, y0 + ch / 2 + 8, '700 34px ' + FONT,
          'rgba(100,116,139,' + (0.85 * aa) + ')', 'center', 'middle');
      }
    }

    var ba = ease((lt - 2.5) / 0.7);
    if (ba > 0.001) {
      var bw = 760, bh = 78, bx = W / 2 - bw / 2, by = 548 + (1 - ba) * 18;
      rr(bx, by, bw, bh, 39);
      ctx.fillStyle = 'rgba(37,99,235,' + (0.08 * ba) + ')'; ctx.fill();
      var bgd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      bgd.addColorStop(0, 'rgba(37,99,235,' + (0.15 * ba) + ')');
      bgd.addColorStop(0.5, 'rgba(37,99,235,' + (0.85 * ba) + ')');
      bgd.addColorStop(1, 'rgba(249,115,22,' + (0.5 * ba) + ')');
      ctx.strokeStyle = bgd; ctx.lineWidth = 2; ctx.stroke();
      text('导出 MP4  ·  旁白与画面同步  ·  可直接用于课堂讲解', W / 2, by + bh / 2 + 1,
        '500 25px ' + FONT, 'rgba(15,23,42,' + ba + ')', 'center', 'middle');
    }
  }

  var SCENES = { title: sceneTitle, projectile: sceneProjectile, spring: sceneSpring, circular: sceneCircular, outro: sceneOutro };

  function sceneTitle(lt, dur) {
    var p = ease(lt / 0.9);
    text('P H Y S I C S   ·   A N I M A T E D   D E M O', W / 2, 236, '600 20px ' + FONT, 'rgba(37,99,235,' + (0.95 * p) + ')', 'center');

    var tg = ctx.createLinearGradient(W / 2 - 400, 0, W / 2 + 400, 0);
    tg.addColorStop(0, '#0f172a'); tg.addColorStop(0.5, '#2563eb'); tg.addColorStop(1, '#0f172a');
    ctx.save();
    ctx.globalAlpha = p;
    text('物理过程 · 动态演示', W / 2, 352, '700 78px ' + FONT, tg, 'center');
    ctx.restore();

    var lw = 520 * ease((lt - 0.35) / 0.8);
    var lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    lg.addColorStop(0, 'rgba(37,99,235,0)'); lg.addColorStop(0.5, 'rgba(37,99,235,1)'); lg.addColorStop(1, 'rgba(249,115,22,0)');
    ctx.fillStyle = lg; ctx.fillRect(W / 2 - lw / 2, 388, lw, 4);

    text('HTML 动画  →  逐帧录制  →  MP4 + 中文旁白', W / 2, 446, '400 25px ' + FONT,
      'rgba(51,65,85,' + (0.9 * ease((lt - 0.6) / 0.9)) + ')', 'center');

    var tags = ['平抛运动', '弹簧振子', '匀速圆周'];
    var cw = 186, gap = 26;
    var totalW = tags.length * cw + (tags.length - 1) * gap;
    var x0 = W / 2 - totalW / 2;
    for (var k = 0; k < tags.length; k++) {
      var ap = ease((lt - 1.15 - k * 0.22) / 0.55);
      if (ap <= 0.001) continue;
      var y = 512 + (1 - ap) * 16;
      ctx.save();
      rr(x0 + k * (cw + gap), y, cw, 52, 26);
      ctx.fillStyle = 'rgba(37,99,235,' + (0.10 * ap) + ')'; ctx.fill();
      ctx.strokeStyle = 'rgba(37,99,235,' + (0.55 * ap) + ')'; ctx.lineWidth = 1.5; ctx.stroke();
      text(tags[k], x0 + k * (cw + gap) + cw / 2, y + 27, '500 22px ' + FONT, 'rgba(15,23,42,' + ap + ')', 'center', 'middle');
      ctx.restore();
    }
  }

  function render(t) {
    t = ((t % TOTAL) + TOTAL) % TOTAL;
    bg(t);
    var idx = 0;
    for (var i = 0; i < SEG.length; i++) { if (t >= SEG[i].start) idx = i; }
    var s = SEG[idx], lt = t - s.start;
    var prevIdx = -1;
    if (idx > 0 && lt < FADE) {
      prevIdx = idx - 1;
      ctx.globalAlpha = 1;
      SCENES[SEG[prevIdx].id](SEG[prevIdx].dur, SEG[prevIdx].dur);
      ctx.globalAlpha = lt / FADE;
    } else {
      ctx.globalAlpha = 1;
    }
    SCENES[s.id](lt, s.dur);
    ctx.globalAlpha = 1;
    syncMath(idx, lt, prevIdx);

    ctx.fillStyle = 'rgba(15,23,42,0.10)';
    ctx.fillRect(0, H - 5, W, 3);
    var pw = Math.max(W * (t / TOTAL), 1);
    var pg = ctx.createLinearGradient(0, 0, pw, 0);
    pg.addColorStop(0, '#2563eb'); pg.addColorStop(1, '#60a5fa');
    ctx.fillStyle = pg;
    ctx.fillRect(0, H - 5, pw, 3);
  }

  buildMath();
  var raf = null, t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    render((ts - t0) / 1000);
    raf = requestAnimationFrame(loop);
  }
  window.__seek = function (t) {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
    render(t);
  };
  window.__meta = { total: TOTAL, segments: SEG };
  window.__ready = true;
  render(0);
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
